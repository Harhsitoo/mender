<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mender — self-healing repo agent</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #13161b;
    --panel-2: #181c22;
    --border: #242a33;
    --text: #e6e9ef;
    --dim: #8b93a1;
    --red: #ff6b63;
    --green: #3fb950;
    --amber: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  a { color: var(--blue); }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #14181e, #0e1116);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .repo { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .repo b { color: var(--text); font-weight: 500; }
  .spacer { flex: 1; }

  .live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(63,185,80,.16); }
  .dot.busy { background: var(--amber); box-shadow: 0 0 0 3px rgba(210,153,34,.16); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px; }

  /* pipeline stepper */
  .pipeline { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .step {
    flex: 1; min-width: 130px; padding: 11px 13px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel); position: relative;
    transition: border-color .2s, background .2s, transform .2s;
  }
  .step .n { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--dim); }
  .step .t { font-weight: 600; margin-top: 3px; }
  .step.active { border-color: var(--blue); background: #101a26; transform: translateY(-1px); }
  .step.active .t { color: var(--blue); }
  .step.done { border-color: #1d3a24; background: #0e1712; }
  .step.done .t { color: var(--green); }
  .step.failed { border-color: #4a2020; background: #1a0f0f; }
  .step.failed .t { color: var(--red); }

  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    margin-bottom: 14px; overflow: hidden;
  }
  .card > h3 {
    margin: 0; padding: 11px 15px; font-size: 12px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--border); background: var(--panel-2);
    display: flex; align-items: center; gap: 9px;
  }
  .card .body { padding: 14px 15px; }
  .card.red { border-color: #4a2020; }
  .card.red > h3 { color: var(--red); background: #1a0f0f; border-bottom-color: #4a2020; }
  .card.green { border-color: #1d3a24; }
  .card.green > h3 { color: var(--green); background: #0e1712; border-bottom-color: #1d3a24; }

  .muted { color: var(--dim); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .nowrap-scroll { overflow-x: auto; }

  ul.tests { list-style: none; margin: 0; padding: 0; }
  ul.tests li { padding: 6px 0; border-bottom: 1px dashed var(--border); font-family: var(--mono); font-size: 12.5px; }
  ul.tests li:last-child { border-bottom: 0; }
  ul.tests .msg { color: var(--dim); display: block; font-size: 11.5px; margin-top: 2px; }

  /* gates */
  .gate { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
  .gate:last-child { border-bottom: 0; }
  .badge {
    flex: none; font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    padding: 3px 7px; border-radius: 5px; height: fit-content; letter-spacing: .04em;
  }
  .badge.pass { background: rgba(63,185,80,.13); color: var(--green); border: 1px solid #1d3a24; }
  .badge.fail { background: rgba(255,107,99,.11); color: var(--red); border: 1px solid #4a2020; }
  .gate .name { font-weight: 600; }
  .gate .detail { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin-top: 2px; font-family: var(--mono); }

  pre.diff {
    margin: 0; padding: 12px 14px; background: #0a0c0f; border-radius: 8px;
    border: 1px solid var(--border); overflow-x: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
  }
  pre.diff .add { color: var(--green); }
  pre.diff .del { color: var(--red); }
  pre.diff .hunk { color: var(--purple); }
  pre.diff .meta { color: var(--dim); }

  .attempt-head { display: flex; align-items: center; gap: 10px; }
  .chip {
    font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--dim); background: var(--panel-2);
  }
  .chip.effort { color: var(--purple); border-color: #35264a; }

  /* sidebar */
  .side .card .body { padding: 12px; }
  button {
    display: block; width: 100%; text-align: left; margin-bottom: 7px;
    padding: 9px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 12.5px; transition: border-color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: var(--blue); background: #101a26; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button .sub { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  button.reset:hover:not(:disabled) { border-color: var(--green); background: #0e1712; }

  .stat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12.5px; }
  .stat .k { color: var(--dim); }
  .stat .v { font-family: var(--mono); }

  .empty { text-align: center; padding: 46px 20px; color: var(--dim); }
  .empty .big { font-size: 30px; margin-bottom: 10px; opacity: .5; }

  .timer { font-family: var(--mono); font-size: 12px; color: var(--amber); }
  .rootcause { white-space: pre-wrap; }
  .banner { padding: 10px 15px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  .banner.err { background: #1a0f0f; color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="brand">Mender<span>Codex writes the fix. Mender proves it.</span></div>
  <div class="repo">watching <b id="repo">…</b> @ <b id="head">…</b></div>
  <div class="spacer"></div>
  <div class="live"><span class="dot" id="dot"></span><span id="livetext">connecting</span></div>
</header>

<div class="wrap">
  <div class="pipeline" id="pipeline"></div>

  <div class="grid">
    <main id="main">
      <div class="empty" id="empty">
        <div class="big">◉</div>
        <div>Suite is green. Seed a bug to watch it heal.</div>
      </div>
    </main>

    <aside class="side">
      <div class="card">
        <h3>Seed a bug</h3>
        <div class="body" id="scenarios"></div>
      </div>
      <div class="card">
        <h3>Run</h3>
        <div class="body">
          <button class="reset" id="btn-reset">Reset repo<span class="sub">Rebuild pristine &amp; green</span></button>
          <button id="btn-heal">Heal now<span class="sub">Force a cycle</span></button>
        </div>
      </div>
      <div class="card">
        <h3>This incident</h3>
        <div class="body" id="stats">
          <div class="stat"><span class="k">status</span><span class="v" id="s-status">idle</span></div>
          <div class="stat"><span class="k">attempt</span><span class="v" id="s-attempt">—</span></div>
          <div class="stat"><span class="k">elapsed</span><span class="v timer" id="s-elapsed">—</span></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
const STEPS = [
  ["detect",   "Detect",    "suite went red"],
  ["collect",  "Collect",   "build the brief"],
  ["fix",      "Fix",       "Codex writes it"],
  ["verify",   "Verify",    "three gates"],
  ["deliver",  "Deliver",   "branch + PR"],
];
const PHASE_TO_STEP = {
  detected: "detect", collecting: "collect", fixing: "fix",
  verifying: "verify", delivering: "deliver",
};

const $ = (id) => document.getElementById(id);
const main = $("main");
let incidentStart = null, timerHandle = null, currentAttempt = null, maxAttempts = 3;

// ---- pipeline ----------------------------------------------------------
function renderPipeline() {
  $("pipeline").innerHTML = STEPS.map(([k, t, s]) =>
    `<div class="step" data-step="${k}"><div class="n">${s}</div><div class="t">${t}</div></div>`
  ).join("");
}
function setStep(key, state) {
  document.querySelectorAll(".step").forEach(el => {
    if (el.dataset.step === key) { el.classList.remove("active","done","failed"); el.classList.add(state); }
  });
}
function advanceTo(key) {
  let seen = false;
  STEPS.forEach(([k]) => {
    const el = document.querySelector(`.step[data-step="${k}"]`);
    if (k === key) { seen = true; el.className = "step active"; }
    else if (!seen) { if (!el.classList.contains("failed")) el.className = "step done"; }
    else el.className = "step";
  });
}
function clearPipeline() {
  document.querySelectorAll(".step").forEach(el => el.className = "step");
}

// ---- helpers -----------------------------------------------------------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function card(cls, title, bodyHTML) {
  const el = document.createElement("div");
  el.className = "card " + (cls || "");
  el.innerHTML = `<h3>${title}</h3><div class="body">${bodyHTML}</div>`;
  main.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return el;
}
function clearMain() { main.innerHTML = ""; }
function hideEmpty() { const e = $("empty"); if (e) e.remove(); }

function renderDiff(diff) {
  if (!diff || !diff.trim()) return '<span class="muted">no changes</span>';
  return diff.split("\n").map(line => {
    const e = esc(line);
    if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("diff ") || line.startsWith("index "))
      return `<span class="meta">${e}</span>`;
    if (line.startsWith("@@")) return `<span class="hunk">${e}</span>`;
    if (line.startsWith("+")) return `<span class="add">${e}</span>`;
    if (line.startsWith("-")) return `<span class="del">${e}</span>`;
    return e;
  }).join("\n");
}

function startTimer() {
  incidentStart = Date.now();
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    $("s-elapsed").textContent = ((Date.now() - incidentStart) / 1000).toFixed(1) + "s";
  }, 100);
}
function stopTimer() { clearInterval(timerHandle); }

function setBusy(on) {
  $("dot").className = "dot " + (on ? "busy" : "on");
  $("livetext").textContent = on ? "healing" : "watching";
  document.querySelectorAll("aside button").forEach(b => b.disabled = on);
}

// ---- event handling ----------------------------------------------------
const HANDLERS = {
  reset() {
    clearMain(); clearPipeline(); stopTimer();
    $("s-status").textContent = "idle";
    $("s-attempt").textContent = "—";
    $("s-elapsed").textContent = "—";
    main.innerHTML = `<div class="empty" id="empty"><div class="big">◉</div>
      <div>Suite is green. Seed a bug to watch it heal.</div></div>`;
    refreshStatus();
  },

  bug_seeded(e) {
    hideEmpty();
    card("", "Commit pushed", `
      <div class="mono">${esc(e.sha)} — <b>${esc(e.title)}</b></div>
      <div class="muted" style="margin-top:4px">touched ${esc(e.file)}</div>`);
  },

  head_moved(e) { $("head").textContent = e.head; },

  incident_detected(e) {
    hideEmpty();
    startTimer();
    setBusy(true);
    $("s-status").textContent = "red";
    advanceTo("detect");
    setStep("detect", "failed");
    const list = (e.failures || []).map(f =>
      `<li>${esc(f.nodeid)}<span class="msg">${esc(f.headline)}</span></li>`).join("");
    card("red", `Suite is red — ${e.failed} of ${e.total} tests failing`,
      `<ul class="tests">${list}</ul>`);
  },

  brief_ready(e) {
    advanceTo("collect");
    card("", "Problem brief", `
      <div class="stat"><span class="k">likely cause</span><span class="v">${esc(e.caused_by)}</span></div>
      <div class="stat"><span class="k">base commit</span><span class="v">${esc(e.base_ref)}</span></div>
      <div class="stat"><span class="k">source in context</span><span class="v">${(e.files||[]).map(esc).join(", ") || "—"}</span></div>`);
  },

  attempt_started(e) {
    currentAttempt = e.attempt;
    maxAttempts = e.of || maxAttempts;
    $("s-attempt").textContent = `${e.attempt} / ${e.of}`;
    $("s-status").textContent = "codex is working";
    advanceTo("fix");
    card("", `<span class="attempt-head">Attempt ${e.attempt} of ${e.of}
      <span class="chip">${esc(e.engine)}</span></span>`,
      `<div class="muted" id="att-${e.attempt}">Codex is reading the code…</div>`);
  },

  attempt_finished(e) {
    const slot = $(`att-${e.attempt}`);
    const files = (e.changed_files || []);
    if (slot) {
      slot.innerHTML = `
        <div class="attempt-head" style="margin-bottom:9px">
          <span class="chip effort">${esc(e.effort)} effort</span>
          <span class="chip">${e.duration}s</span>
          <span class="chip">${files.length} file${files.length === 1 ? "" : "s"}</span>
        </div>
        ${e.summary ? `<div class="rootcause" style="margin-bottom:10px">${esc(e.summary)}</div>` : ""}
        <pre class="diff">${renderDiff(e.diff)}</pre>`;
    }
    $("s-status").textContent = "verifying";
    advanceTo("verify");
  },

  gate(e) {
    let host = $(`gates-${e.attempt}`);
    if (!host) {
      const el = card("", `Verification — attempt ${e.attempt}`, `<div id="gates-${e.attempt}"></div>`);
      host = el.querySelector(`#gates-${e.attempt}`);
    }
    const div = document.createElement("div");
    div.className = "gate";
    div.innerHTML = `
      <span class="badge ${e.passed ? "pass" : "fail"}">${e.passed ? "PASS" : "FAIL"}</span>
      <div><div class="name">${esc(e.name)}</div><div class="detail">${esc(e.detail)}</div></div>`;
    host.appendChild(div);
    if (!e.passed) setStep("verify", "failed");
  },

  branch_created(e) {
    advanceTo("deliver");
    card("", "Branch created", `<div class="mono">${esc(e.branch)} → ${esc(e.sha)}</div>`);
  },

  pr_opened(e) {
    card("green", "Pull request opened", `<a href="${esc(e.url)}" target="_blank">${esc(e.url)}</a>`);
  },

  pr_skipped(e) {
    card("", "Pull request skipped", `<div class="muted">${esc(e.reason)}</div>`);
  },

  healed(e) {
    stopTimer(); setBusy(false);
    $("s-status").textContent = "healed";
    $("s-elapsed").textContent = e.elapsed + "s";
    STEPS.forEach(([k]) => setStep(k, "done"));
    card("green", `Healed in ${e.elapsed}s — ${e.attempts} attempt${e.attempts === 1 ? "" : "s"}`, `
      <div style="margin-bottom:10px"><b>${esc(e.test)}</b> now passes, and so does everything else.</div>
      <div class="rootcause">${esc(e.root_cause)}</div>
      ${e.branch ? `<div class="stat" style="margin-top:10px"><span class="k">branch</span><span class="v">${esc(e.branch)}</span></div>` : ""}
      ${e.pr_url ? `<div class="stat"><span class="k">pull request</span><span class="v"><a href="${esc(e.pr_url)}" target="_blank">open</a></span></div>` : ""}`);
    refreshStatus();
  },

  gave_up(e) {
    stopTimer(); setBusy(false);
    $("s-status").textContent = "gave up";
    setStep("deliver", "failed");
    card("red", `Gave up after ${e.attempts} attempts`, `
      <div style="margin-bottom:8px">No patch cleared every gate, so nothing was proposed.</div>
      <div class="detail mono muted" style="white-space:pre-wrap">${esc(e.last_rejection)}</div>`);
  },

  suite_green() {
    setBusy(false);
    $("s-status").textContent = "green";
  },

  error(e) {
    setBusy(false);
    card("red", "Error", `<div class="mono">${esc(e.message)}</div>`);
  },
};

// ---- wiring ------------------------------------------------------------
function connect() {
  const source = new EventSource("/events?since=0");
  source.onopen = () => { $("dot").className = "dot on"; $("livetext").textContent = "watching"; };
  source.onerror = () => { $("dot").className = "dot"; $("livetext").textContent = "reconnecting"; };
  source.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    const handler = HANDLERS[event.kind];
    if (handler) handler(event);
  };
}

async function refreshStatus() {
  const r = await fetch("/api/status");
  const s = await r.json();
  $("repo").textContent = s.repo.split("/").pop();
  $("head").textContent = s.head;
  maxAttempts = s.max_attempts;
  if (!$("scenarios").dataset.filled) {
    $("scenarios").dataset.filled = "1";
    $("scenarios").innerHTML = s.scenarios.map(sc =>
      `<button data-key="${sc.key}">${esc(sc.title)}<span class="sub">${esc(sc.file)}</span></button>`
    ).join("");
    $("scenarios").querySelectorAll("button").forEach(b =>
      b.onclick = () => post(`/api/break/${b.dataset.key}`));
  }
}

async function post(url) {
  const r = await fetch(url, { method: "POST" });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    alert(body.error || `request failed (${r.status})`);
  }
}

$("btn-reset").onclick = () => post("/api/reset");
$("btn-heal").onclick = () => post("/api/heal");

renderPipeline();
refreshStatus();
connect();
</script>
</body>
</html>
