[project]
name = "mender"
version = "0.1.0"
description = "A self-healing repo agent: detects failing tests, has Codex write the fix, independently verifies it did not cheat, and opens a PR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
mender = "mender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
