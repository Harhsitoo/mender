name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # The suite creates real git repositories in temp directories, so the
      # runner needs an identity even though every commit also passes one.
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
          git config --global init.defaultBranch main

      - run: python -m pytest -q

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds only — nothing is pushed. This is what proves the deployment
      # image is sound without needing a container runtime on a laptop.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mender:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Codex CLI is installed in the image
        run: docker run --rm --entrypoint codex mender:ci --version

      # A deployment without these has no fallback when Codex is
      # unauthenticated, which turns a missing key into a dead page.
      - name: Recorded sessions are present
        run: |
          count=$(docker run --rm --entrypoint sh mender:ci -c 'ls replays/*.json | wc -l')
          echo "transcripts in image: $count"
          test "$count" -ge 4

      - name: Mender starts and answers its health check
        run: |
          docker run -d --name mender -p 8000:8000 mender:ci
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8000/healthz; then
              echo "\nhealthy"
              docker rm -f mender
              exit 0
            fi
            sleep 2
          done
          echo "did not become healthy in 60s"
          docker logs mender
          docker rm -f mender
          exit 1
