# Render blueprint. Connect the GitHub repo and Render builds the Dockerfile.
#
# No secrets are required. Without OPENAI_API_KEY the instance serves recorded
# sessions — real event logs from real heals, replayed at their original speed
# and labelled as replays in the UI. Adding a funded key later turns the same
# deployment live with no code change.
services:
  - type: web
    name: mender
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Free instances sleep after ~15 minutes idle and take roughly 50 seconds
    # to wake. Keep a scheduled request hitting /healthz every 10 minutes if
    # the link needs to be reliably instant for a reviewer.
    plan: free
    envVars:
      # Optional. Leave unset to run in replay mode.
      - key: OPENAI_API_KEY
        sync: false
      - key: MENDER_PUBLIC
        value: "1"
